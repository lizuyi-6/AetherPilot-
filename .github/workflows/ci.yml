name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Unit tests
        run: python -m pytest backend/tests -q --ignore=backend/tests/e2e_smoke.py --ignore=backend/tests/e2e_approval.py

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install, type-check, build
        working-directory: frontend
        run: |
          npm ci
          npx vue-tsc --noEmit
          npm run build
